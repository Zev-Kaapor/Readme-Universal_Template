<!-- NAV BUTTON (um arquivo por botão. Troque o texto e a largura: width e o 3º número do viewBox, hoje 157, regra de 9,4 por letra + 44. Troque também os dois HEX do degradê) -->
<!-- CUIDADO! Link dentro de SVG não é clicável: use o botão como imagem dentro de um link, assim: <a href="#secao"><img src="assets/nav-nome.svg" alt="Texto" height="34" /></a> -->
<svg xmlns="http://www.w3.org/2000/svg" width="157" height="40" viewBox="0 0 157 40" role="img" aria-label="How it works">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E4DB7"/>
      <stop offset="1" stop-color="#3FA9F5"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="100%" height="100%" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sweep { 0% { transform: translateX(0); } 45%, 100% { transform: translateX(380px); } }
    .p { animation: pop 0.6s ease-out 0.18s both; }
    .w { animation: sweep 4.5s ease-in-out 1.55s infinite; }
  </style>
  <g class="p">
    <rect width="100%" height="100%" rx="20" fill="url(#g)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <g clip-path="url(#c)"><g transform="skewX(-20)"><rect class="w" x="-100" y="0" width="60" height="100%" fill="url(#s)"/></g></g>
    <text x="50%" y="25.5" font-size="15" font-weight="600" text-anchor="middle" fill="#ffffff">How it works</text>
  </g>
</svg>
